[project]
name = "bills-split"
version = "0.1.0"
description = "Local demo of a restaurant ordering and bill-splitting idea"
authors = [{name = "Elick Chitrit"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.32,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bills_split"]
